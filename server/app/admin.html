<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- As a heading -->
    <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Remote UX System</span>
    </div>
    </nav>
    
    <div class="container-fluid mt-4">
        <h1>Trigger Event (token: <span id="token"></span>)</h1>


        <div class="d-grid gap-2 p-4">
        <button class="btn btn-primary" id="img1" type="button">Display Image</button>
        <button class="btn btn-primary" id="img2" type="button">Display Image 2</button>
        <button class="btn btn-primary" id="note" type="button">
            Send Notification
        </button>
        <button class="btn btn-primary" id="reload" type="button">
            Reload Client
        </button>
        </div>


    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const imgOne = document.getElementById('img1');
        const imgTwo = document.getElementById('img2');
        const note = document.getElementById('note');
        const reload = document.getElementById('reload');
        const token = document.getElementById('token');


        socket.on('securedToken', (msg) => {
            console.log(`Token: ${msg}`)
            token.innerHTML = msg;
        })

        imgOne.addEventListener('click', (e) => {
            e.preventDefault();
            socket.emit('newElement', 'https://placehold.co/600x400?text=Image+One')
        })
        imgTwo.addEventListener('click', (e) => {
            e.preventDefault();
            socket.emit('newElement', 'https://placehold.co/600x400?text=Image+Two')
        })
        note.addEventListener('click', (e) => {
            e.preventDefault();
            socket.emit('newElementAlert', 'https://placehold.co/600x400?text=Image+Two')
        })
        reload.addEventListener('click', (e) => {
            e.preventDefault();
            socket.emit('reloadClient');
        })
    </script>
</body>

</html>
