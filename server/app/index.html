<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <title>Socket</title>
</head>

<body>

    <main>
        <img id="remoteConfig" src="" alt="">
        <h1 id="remoteConfigURL" class="subtitle"></h1>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script>
        const remoteConfig = document.getElementById('remoteConfig');
        const remoteConfigurl = document.getElementById('remoteConfigURL');
        const socket = io();

        socket.on('newElement', (msg) => {
            remoteConfig.src = msg;
            remoteConfigurl.innerHTML = msg;
        })

        socket.on('newElementAlert', (msg) => {
            Swal.fire({
                title: 'Error!',
                text: 'Do you want to continue',
                icon: 'error',
                confirmButtonText: 'Cool'
            })
        })

        socket.on('reloadClient', () => {
            window.location.reload();
        })
    </script>
</body>

</html>
